name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s --health-retries=20
    env:
      RAILS_ENV: test
      DB_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true
      - run: bin/rails db:create db:schema:load
      - run: bundle exec rspec
      # OpenAPIの仕様書がテスト（spec/integration）と食い違っていないか
      - name: OpenAPIの仕様書が最新か確認
        run: |
          bin/rails rswag:specs:swaggerize
          git diff --exit-code swagger/ || (echo "::error::bin/rails rswag:specs:swaggerize を実行してコミットしてください" && exit 1)
      - run: bin/rubocop
      - run: bin/brakeman --no-pager

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # OpenAPIから生成した型が最新か（backend の仕様書を変えたら npm run gen:api が必要）
      - name: APIの型が最新か確認
        run: |
          npm run gen:api
          git diff --exit-code src/lib/api-schema.ts || (echo "::error::npm run gen:api を実行してコミットしてください" && exit 1)
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
