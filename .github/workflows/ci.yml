name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s --health-retries=20
    env:
      RAILS_ENV: test
      DB_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true
      - run: bin/rails db:create db:schema:load
      - run: bundle exec rspec
      # OpenAPIの仕様書がテスト（spec/integration）と食い違っていないか
      - name: OpenAPIの仕様書が最新か確認
        run: |
          bin/rails rswag:specs:swaggerize
          git diff --exit-code swagger/ || (echo "::error::bin/rails rswag:specs:swaggerize を実行してコミットしてください" && exit 1)
      - run: bin/rubocop
      - run: bin/brakeman --no-pager
      # gem の既知の脆弱性（最新の脆弱性データベースを取ってきて照らし合わせる）
      - run: bin/bundler-audit check --update

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 本番で使うパッケージの既知の脆弱性（high 以上で失敗。開発用ツールと moderate 以下は対象外）
      - run: npm audit --omit=dev --audit-level=high
      # OpenAPIから生成した型と AI の道具の定義が最新か（backend の仕様書や AI の許可リストを変えたら npm run gen:api が必要）
      - name: APIの型が最新か確認
        run: |
          npm run gen:api
          git diff --exit-code src/lib/api-schema.ts src/lib/ai/generated-tools.ts || (echo "::error::npm run gen:api を実行してコミットしてください" && exit 1)
      - name: ご利用ルールの検索用データが最新か確認
        run: |
          npm run gen:rules
          git diff --exit-code src/lib/ai/faq/generated-rules.ts || (echo "::error::docs/rules を変えたら npm run gen:rules を実行してコミットしてください" && exit 1)
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  # 画面を通した動作確認（Rails＋Next.jsを起動し、seedのデータで操作する）
  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s --health-retries=20
    env:
      RAILS_ENV: test
      DB_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: DBの準備（seedのテストアカウント・拠点を入れる）
        working-directory: backend
        run: bin/rails db:create db:schema:load db:seed
      - name: 依存関係とブラウザのインストール
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2Eテスト
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      # 通知の Lambda（Python）の判定のテスト（AWS を呼ばない）
      - run: python3 -m unittest discover -s lambda/service_notify

  # 本番用のDockerイメージがビルドできるか（ベースイメージの更新漏れ・Dockerfileの誤りを検出する。pushはしない）
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag cowork-hub-${{ matrix.app }}:ci ${{ matrix.app }}
