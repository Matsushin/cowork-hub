name: Claude Code Review

# PRの作成・更新時に、Claude Codeが自動でコードレビューする
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # ドラフトPRと、フォークからのPR（シークレットを渡さないため）は対象外
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # どちらか一方をリポジトリのシークレットに登録する
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          # @claude の修正コミットは github-actions[bot] 名義になる。
          # Actionは既定でボット起点の実行を拒否するため、このボットだけ許可して再レビューさせる
          allowed_bots: "github-actions[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            このプルリクエストをレビューしてください。
            PRのブランチはカレントディレクトリにチェックアウト済みです。

            手順:
            1. リポジトリ直下の CLAUDE.md を読み、「コードレビューの観点」に従う
            2. `gh pr view` と `gh pr diff` で変更内容を把握する
            3. 必要に応じて周辺のコードも読み、変更の影響を確認する

            コメントのルール:
            - すべて日本語で書く
            - 具体的な問題点は `mcp__github_inline_comment__create_inline_comment`（confirmed: true）で該当行にコメントする
            - 各指摘の先頭に重要度を付ける：【必須】マージ前に直すべき／【推奨】直したほうがよい／【参考】好みや将来の改善
            - 最後に `gh pr comment` で総評を1件だけ投稿する（良い点、指摘の件数、マージしてよいかの判断）
            - 問題がなければ、無理に指摘を作らず「問題なし」と書く
            - GitHubへのコメント以外のメッセージで結果を返さない

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
