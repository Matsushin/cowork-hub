name: 週1回のメンテナンス（AI）

# 毎週月曜 9:00（日本時間）に、Claude Code に次の2つをやらせて、変更があれば PR にする（手順は .claude/skills/weekly-maintenance）
#   deps：依存ライブラリの更新（パッチ・マイナーまで）。CI と同じ確認を通し、壊れたら小さく直すか、そのライブラリだけ見送る
#   docs：README・CLAUDE.md・スキルとコードの食い違いを直す（ドキュメントだけ）
# AI に渡すのはファイルの編集と決まったコマンドだけ。コミット・push・PR の作成は、AI のあとのステップが決まったコマンドで行う
# （main にブランチ保護がないため、AI に push の権限を渡さない）。PR はブランチごとに1本で毎週上書きし、マージは人が行う。
on:
  schedule:
    - cron: "0 0 * * 1" # 月曜 0:00 UTC ＝ 9:00 JST
  workflow_dispatch:
    inputs:
      task:
        description: どの作業をするか
        type: choice
        options: [both, deps, docs]
        default: both

concurrency:
  group: weekly-maintenance
  cancel-in-progress: false

jobs:
  deps:
    if: github.event_name == 'schedule' || inputs.task != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s --health-retries=20
    env:
      RAILS_ENV: test
      DB_HOST: 127.0.0.1
    steps:
      # push と PR の作成は専用 GitHub App のトークンで行う（GITHUB_TOKEN だと PR に CI と自動レビューが走らない）
      - name: GitHub Appのトークンを発行
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true

      # setup-ruby は Gemfile.lock を変えられない設定（deployment）にするので、更新できるように戻す
      - name: bundle update できるようにする
        working-directory: backend
        run: |
          bundle config set --local deployment false
          bundle config set --local frozen false

      - name: テスト用DBを準備
        working-directory: backend
        run: bin/rails db:create db:schema:load

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: フロントエンドの依存をインストール
        working-directory: frontend
        run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: |
            REPO: ${{ github.repository }}

            週1回の依存ライブラリの更新です。.claude/skills/weekly-maintenance/SKILL.md の「A. 依存ライブラリの更新」の手順に沿って進めてください。
            テスト環境は準備済みです（MySQL はサービスコンテナで起動、テスト用DB作成済み、gem と npm パッケージもインストール済み）。
            結果は手順の通り /tmp/maintenance/pr-title.txt と /tmp/maintenance/pr-body.md に書きます。コミット・push・PR の作成はしません（次のステップが行う）。
            日本語で書きます。
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(cd:*),Bash(bundle outdated:*),Bash(bundle update:*),Bash(bundle install:*),Bash(bundle exec rspec:*),Bash(bin/rubocop:*),Bash(bin/brakeman:*),Bash(bin/bundler-audit:*),Bash(bin/rails:*),Bash(npm outdated:*),Bash(npm update:*),Bash(npm ci:*),Bash(npm audit:*),Bash(npm run:*),Bash(npm test:*),Bash(npx tsc:*),Bash(git status:*),Bash(git diff:*),Bash(git checkout --:*),Bash(mkdir -p /tmp/maintenance)"

      - name: PR を作る（変更があれば）
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .github/scripts/open-maintenance-pr.sh maintenance/deps

  docs:
    if: github.event_name == 'schedule' || inputs.task != 'deps'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: GitHub Appのトークンを発行
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 100 # この1週間のコミットを見るため
          token: ${{ steps.app-token.outputs.token }}

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: |
            REPO: ${{ github.repository }}

            週1回のドキュメントの見直しです。.claude/skills/weekly-maintenance/SKILL.md の「B. ドキュメントの見直し」の手順に沿って進めてください。
            直してよいのは README.md・CLAUDE.md・.claude/skills/ の下のファイルだけです。
            結果は手順の通り /tmp/maintenance/pr-title.txt と /tmp/maintenance/pr-body.md に書きます。コミット・push・PR の作成はしません（次のステップが行う）。
            日本語で書きます。
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Edit(/README.md),Edit(/CLAUDE.md),Edit(/.claude/skills/**),Write(//tmp/maintenance/**),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git status:*),Bash(mkdir -p /tmp/maintenance)"

      # ドキュメント以外が変わっていたら PR にしない（念のため）
      - name: ドキュメント以外が変わっていないか確かめる
        run: |
          other=$(git status --porcelain | awk '{print $2}' | grep -vE '^(README\.md|CLAUDE\.md|\.claude/skills/)' || true)
          if [ -n "$other" ]; then
            echo "::error::ドキュメント以外のファイルが変わっています: $other"
            exit 1
          fi

      - name: PR を作る（変更があれば）
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .github/scripts/open-maintenance-pr.sh maintenance/docs
