name: Claude Code

# PRやIssueのコメントで @claude と書くと、Claude Codeが応答する
# 例: 「@claude この指摘を修正して」「@claude この関数の意図を説明して」
# Issueにラベル「claude-implement」を付けると、Claude Codeが実装してPRを作る
#   （ラベルを付けられるのは書き込み権限のある人だけなので、公開リポジトリでも第三者には起動できない）
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]

jobs:
  claude:
    # 公開リポジトリのため、オーナー・メンバー・コラボレーターの書き込みにだけ反応する
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' && github.event.action != 'labeled' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude-implement' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    # Issueからの実装（テストの実行を含む）に時間がかかるため長めにする
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # PRのCI結果を読むため
    # Claudeがテストを実行してからコミットできるよう、CIと同じ環境を用意する
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s --health-retries=20
    env:
      RAILS_ENV: test
      DB_HOST: 127.0.0.1
    steps:
      # 専用GitHub Appのトークンを発行する。
      # GITHUB_TOKENでのpushはほかのワークフローを起動しないため、
      # Appのトークンでpushして、Claudeの修正にもCIと自動レビューが走るようにする。
      # （CLAUDE_APP_ID が未設定なら、このステップは飛ばして既定のトークンで動く）
      - name: GitHub Appのトークンを発行
        id: app-token
        if: vars.CLAUDE_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true

      - name: テスト用DBを準備
        working-directory: backend
        run: bin/rails db:create db:schema:load

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: フロントエンドの依存をインストール
        working-directory: frontend
        run: npm ci

      - uses: anthropics/claude-code-action@v1
        env:
          # Claudeが gh pr create でPRを作るためのトークン（Appのトークンなら、PRにもCIと自動レビューが走る）
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          label_trigger: claude-implement
          claude_args: |
            --allowedTools "Bash(bundle exec rspec:*),Bash(bin/rubocop:*),Bash(bin/rails:*),Bash(npm run:*),Bash(npm test:*),Bash(npm ci:*),Bash(npx tsc:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr view:*)"
            --append-system-prompt "日本語で応答してください。作業前にリポジトリ直下の CLAUDE.md を読み、規約に従ってください。テスト環境は準備済みです（MySQLはサービスコンテナで起動、テスト用DB作成済み、gemとnpmパッケージもインストール済み）。コードを変更したら、コミット前に backend で bundle exec rspec と bin/rubocop、frontend で npm run lint と npm run format:check と npx tsc --noEmit と npm test を実行し、すべて通ることを確認してください。Issueの実装を頼まれたとき（ラベル claude-implement）は、.claude/skills/add-feature/SKILL.md の手順に沿って進め、最後に gh pr create でmainへのPRを作ってください。PRのタイトルは日本語、本文には「Closes #Issue番号」「何を・なぜ」「確認したこと」「確認できていないこと」を書きます。E2E（Playwright）とブラウザでの確認はこの環境ではできないので、確認できていないことに書いてください。仕様が曖昧で決められない点があれば、実装せずにIssueへ質問をコメントしてください。PRのマージはしないでください。"
