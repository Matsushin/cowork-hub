name: Claude Code

# PRやIssueのコメントで @claude と書くと、Claude Codeが応答する
# 例: 「@claude この指摘を修正して」「@claude この関数の意図を説明して」
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # 公開リポジトリのため、オーナー・メンバー・コラボレーターの書き込みにだけ反応する
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # PRのCI結果を読むため
    # Claudeがテストを実行してからコミットできるよう、CIと同じ環境を用意する
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s --health-retries=20
    env:
      RAILS_ENV: test
      DB_HOST: 127.0.0.1
    steps:
      # 専用GitHub Appのトークンを発行する。
      # GITHUB_TOKENでのpushはほかのワークフローを起動しないため、
      # Appのトークンでpushして、Claudeの修正にもCIと自動レビューが走るようにする。
      # （CLAUDE_APP_ID が未設定なら、このステップは飛ばして既定のトークンで動く）
      - name: GitHub Appのトークンを発行
        id: app-token
        if: vars.CLAUDE_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true

      - name: テスト用DBを準備
        working-directory: backend
        run: bin/rails db:create db:schema:load

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: フロントエンドの依存をインストール
        working-directory: frontend
        run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          claude_args: |
            --append-system-prompt "日本語で応答してください。作業前にリポジトリ直下の CLAUDE.md を読み、規約に従ってください。テスト環境は準備済みです（MySQLはサービスコンテナで起動、テスト用DB作成済み、gemとnpmパッケージもインストール済み）。コードを変更したら、コミット前に backend で bundle exec rspec と bin/rubocop、frontend で npm run lint と npx tsc --noEmit を実行し、すべて通ることを確認してください。"
