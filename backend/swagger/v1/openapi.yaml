---
openapi: 3.0.3
info:
  title: ee-office API
  version: v1
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: ログイン・会員登録で受け取ったトークン
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        errors:
          type: object
          description: 項目名 → エラーメッセージ一覧（項目に属さないものは base）。バリデーションエラー（422）のときだけ返す
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - error
    Plan:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          type: string
          enum:
          - drop_in
          - monthly
        price:
          type: integer
        monthly_hours_limit:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true
      required:
      - id
      - name
      - kind
      - price
      - monthly_hours_limit
      - description
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email_address:
          type: string
        role:
          type: string
          enum:
          - member
          - admin
        plan:
          allOf:
          - "$ref": "#/components/schemas/Plan"
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - email_address
      - role
      - plan
      - created_at
    UserDetail:
      allOf:
      - "$ref": "#/components/schemas/User"
      - type: object
        properties:
          reservations:
            type: array
            items:
              "$ref": "#/components/schemas/Reservation"
          visits:
            type: array
            items:
              "$ref": "#/components/schemas/Visit"
        required:
        - reservations
        - visits
    UserSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email_address:
          type: string
      required:
      - id
      - name
      - email_address
    SessionResponse:
      type: object
      properties:
        token:
          type: string
        user:
          "$ref": "#/components/schemas/User"
      required:
      - token
      - user
    Location:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        prefecture:
          type: string
        address:
          type: string
        description:
          type: string
          nullable: true
        open_hour:
          type: integer
        close_hour:
          type: integer
        hourly_price:
          type: integer
        daily_max_price:
          type: integer
        active:
          type: boolean
        current_visitors:
          type: integer
          description: 利用中の人数（一覧・詳細のみ）
      required:
      - id
      - name
      - prefecture
      - address
      - description
      - open_hour
      - close_hour
      - hourly_price
      - daily_max_price
      - active
    LocationDetail:
      allOf:
      - "$ref": "#/components/schemas/Location"
      - type: object
        properties:
          spaces:
            type: array
            items:
              "$ref": "#/components/schemas/Space"
        required:
        - spaces
    Space:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          type: string
          enum:
          - seat
          - meeting_room
        capacity:
          type: integer
        hourly_price:
          type: integer
        active:
          type: boolean
        location_id:
          type: integer
        location:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
          required:
          - id
          - name
          description: 予約・管理画面のみ
      required:
      - id
      - name
      - kind
      - capacity
      - hourly_price
      - active
      - location_id
    AiRequest:
      type: object
      description: AI 機能の利用記録（1回の相談）。入力の文章や AI の回答は含まない
      properties:
        id:
          type: integer
        feature:
          type: string
          enum:
          - booking
        status:
          type: string
          enum:
          - started
          - succeeded
          - failed
          - refused
        created_at:
          type: string
          format: date-time
        remaining_today:
          type: integer
          description: 今日あと何回使えるか
      required:
      - id
      - feature
      - status
      - created_at
      - remaining_today
    Reservation:
      type: object
      properties:
        id:
          type: integer
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - confirmed
          - canceled
        amount:
          type: integer
        space:
          "$ref": "#/components/schemas/Space"
        cancelable:
          type: boolean
        user:
          "$ref": "#/components/schemas/UserSummary"
          description: 管理画面のみ
      required:
      - id
      - starts_at
      - ends_at
      - status
      - amount
      - space
      - cancelable
    Availability:
      type: object
      properties:
        date:
          type: string
          format: date
        open_hour:
          type: integer
        close_hour:
          type: integer
        slot_minutes:
          type: integer
        reserved:
          type: array
          items:
            type: object
            properties:
              space_id:
                type: integer
              starts_at:
                type: string
                format: date-time
              ends_at:
                type: string
                format: date-time
              mine:
                type: boolean
            required:
            - space_id
            - starts_at
            - ends_at
            - mine
      required:
      - date
      - open_hour
      - close_hour
      - slot_minutes
      - reserved
    Visit:
      type: object
      properties:
        id:
          type: integer
        checked_in_at:
          type: string
          format: date-time
        checked_out_at:
          type: string
          format: date-time
          nullable: true
        amount:
          type: integer
          nullable: true
        auto_checked_out:
          type: boolean
          description: チェックアウトし忘れを閉店時刻で自動的に締めた利用か
        estimated_amount:
          type: integer
          description: 利用中のみ。今チェックアウトした場合の料金
        auto_checkout_at:
          type: string
          format: date-time
          description: 利用中のみ。チェックアウトし忘れた場合に自動で締める時刻（閉店時刻）
        duration_minutes:
          type: integer
        location:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
          required:
          - id
          - name
        user:
          "$ref": "#/components/schemas/UserSummary"
      required:
      - id
      - checked_in_at
      - checked_out_at
      - amount
      - auto_checked_out
      - duration_minutes
      - location
    Bill:
      type: object
      properties:
        month:
          type: string
          example: 2026-11
        plan:
          allOf:
          - "$ref": "#/components/schemas/Plan"
          nullable: true
        plan_fee:
          type: integer
        visits:
          type: array
          items:
            "$ref": "#/components/schemas/Visit"
        visits_total:
          type: integer
        reservations:
          type: array
          items:
            "$ref": "#/components/schemas/Reservation"
        reservations_total:
          type: integer
        total:
          type: integer
      required:
      - month
      - plan
      - plan_fee
      - visits
      - visits_total
      - reservations
      - reservations_total
      - total
    Sales:
      type: object
      properties:
        month:
          type: string
          example: 2026-11
        locations:
          type: array
          items:
            type: object
            properties:
              location:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  prefecture:
                    type: string
                required:
                - id
                - name
                - prefecture
              visit_count:
                type: integer
              visit_amount:
                type: integer
              reservation_amount:
                type: integer
              total:
                type: integer
            required:
            - location
            - visit_count
            - visit_amount
            - reservation_amount
            - total
        plan_amount:
          type: integer
        total:
          type: integer
      required:
      - month
      - locations
      - plan_amount
      - total
    UsageStats:
      type: object
      description: 利用状況の集計。金額は円（税込）、時間は時間（小数1桁）、稼働率は％（会議室の予約時間 ÷ 予約できた時間、小数1桁）
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        group_by:
          type: string
          enum:
          - location
          - space
          - month
          - weekday
          - hour
        location:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
          required:
          - id
          - name
          nullable: true
        rows:
          type: array
          items:
            type: object
            properties:
              key:
                oneOf:
                - type: integer
                - type: string
                description: 拠点・スペースの ID、月（YYYY-MM）、曜日（0=日曜）、時（0〜23）
              label:
                type: string
                example: 渋谷
              reservation_count:
                type: integer
                description: 会議室などの予約の件数（確定のもの）
              reservation_hours:
                type: number
                description: 予約の時間の合計
              reservation_amount:
                type: integer
                description: 予約の金額の合計（円）
              visit_count:
                type: integer
                nullable: true
                description: ドロップインの利用の件数
              visit_hours:
                type: number
                nullable: true
                description: ドロップインの利用時間の合計
              visit_amount:
                type: integer
                nullable: true
                description: ドロップインの金額の合計（円）
              total_amount:
                type: integer
                description: 予約とドロップインの金額の合計（円）。月額プランの料金は含まない
              utilization_rate:
                type: number
                nullable: true
                description: 会議室の稼働率（％）。時間帯ごとのときと、会議室がないときは null
            required:
            - key
            - label
            - reservation_count
            - reservation_hours
            - reservation_amount
            - visit_count
            - visit_hours
            - visit_amount
            - total_amount
            - utilization_rate
        totals:
          type: object
          properties:
            reservation_count:
              type: integer
              description: 会議室などの予約の件数（確定のもの）
            reservation_hours:
              type: number
              description: 予約の時間の合計
            reservation_amount:
              type: integer
              description: 予約の金額の合計（円）
            visit_count:
              type: integer
              nullable: true
              description: ドロップインの利用の件数
            visit_hours:
              type: number
              nullable: true
              description: ドロップインの利用時間の合計
            visit_amount:
              type: integer
              nullable: true
              description: ドロップインの金額の合計（円）
            total_amount:
              type: integer
              description: 予約とドロップインの金額の合計（円）。月額プランの料金は含まない
            utilization_rate:
              type: number
              nullable: true
              description: 会議室の稼働率（％）。時間帯ごとのときと、会議室がないときは null
          required:
          - reservation_count
          - reservation_hours
          - reservation_amount
          - visit_count
          - visit_hours
          - visit_amount
          - total_amount
          - utilization_rate
      required:
      - from
      - to
      - group_by
      - location
      - rows
      - totals
    MemberStats:
      type: object
      description: 会員数の集計（人数だけ。個人の情報は含まない）
      properties:
        month:
          type: string
          example: 2026-11
        member_count:
          type: integer
          description: 月末（今月なら今日）時点でプランを契約している人数
        new_member_count:
          type: integer
          description: その月に登録した人数（管理者を含む。プランを契約していない人も数える）
        active_member_count:
          type: integer
          description: その月に会議室を予約したか、ドロップインを使った人数
        by_plan:
          type: array
          items:
            type: object
            properties:
              plan:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  kind:
                    type: string
                  price:
                    type: integer
                required:
                - id
                - name
                - kind
                - price
              member_count:
                type: integer
              plan_amount:
                type: integer
                description: 月額プランの料金の合計（ドロップインは0）
            required:
            - plan
            - member_count
            - plan_amount
      required:
      - month
      - member_count
      - new_member_count
      - active_member_count
      - by_plan
    CheckinCode:
      type: object
      description: 受付のQRコードに入れるチェックイン用のコード。今と1つ前の時間枠のコードが有効
      properties:
        location:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
          required:
          - id
          - name
        code:
          type: string
          example: 3f2a9c0d1b7e4a56
        expires_at:
          type: string
          format: date-time
          description: このコードが「今の時間枠」でなくなる時刻（この後も1枠分は使える）
        expires_in:
          type: integer
          description: expires_at までの残り秒数（サーバーの時刻で計算）
        interval:
          type: integer
          description: 時間枠の長さ（秒）
          example: 60
      required:
      - location
      - code
      - expires_at
      - expires_in
      - interval
security:
- bearer: []
paths:
  "/api/admin/users":
    get:
      summary: 会員一覧
      tags:
      - 管理
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: 名前・メールアドレスの部分一致
      responses:
        '200':
          description: 会員一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/User"
        '403':
          description: 管理者以外
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/admin/users/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: integer
      required: true
    get:
      summary: 会員の詳細（直近の予約・利用つき）
      tags:
      - 管理
      responses:
        '200':
          description: 会員の詳細
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserDetail"
        '404':
          description: 存在しない会員
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      summary: 会員の権限・プランの変更
      tags:
      - 管理
      parameters: []
      responses:
        '200':
          description: 変更した
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '422':
          description: 存在しない権限
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    role:
                      type: string
                      enum:
                      - member
                      - admin
                    plan_id:
                      type: integer
              required:
              - user
  "/api/admin/reservations":
    get:
      summary: 全会員の予約（新しい順・200件まで）
      tags:
      - 管理
      parameters:
      - name: date
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: 予約一覧（会員情報つき）
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Reservation"
        '403':
          description: 管理者以外
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/admin/locations":
    get:
      summary: 拠点一覧（非公開を含む）
      tags:
      - 管理
      responses:
        '200':
          description: 拠点一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Location"
        '403':
          description: 管理者以外
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      summary: 拠点の追加
      tags:
      - 管理
      parameters: []
      responses:
        '201':
          description: 追加した
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Location"
        '422':
          description: 入力内容の誤り
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                location:
                  type: object
                  properties:
                    name:
                      type: string
                    prefecture:
                      type: string
                    address:
                      type: string
                    description:
                      type: string
                    open_hour:
                      type: integer
                    close_hour:
                      type: integer
                    hourly_price:
                      type: integer
                    daily_max_price:
                      type: integer
                  required:
                  - name
                  - prefecture
                  - address
                  - open_hour
                  - close_hour
                  - hourly_price
                  - daily_max_price
              required:
              - location
  "/api/admin/locations/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: integer
      required: true
    patch:
      summary: 拠点の更新（公開・非公開の切り替えなど）
      tags:
      - 管理
      parameters: []
      responses:
        '200':
          description: 更新した
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Location"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                location:
                  type: object
                  properties:
                    active:
                      type: boolean
              required:
              - location
  "/api/admin/locations/{id}/checkin_code":
    parameters:
    - name: id
      in: path
      schema:
        type: integer
      required: true
    get:
      summary: 受付用QRのコード（60秒ごとに変わる）
      tags:
      - 管理
      responses:
        '200':
          description: 今の時間枠のコード
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CheckinCode"
        '403':
          description: 管理者以外
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: 未ログイン
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/admin/spaces":
    get:
      summary: スペース一覧（非公開を含む）
      tags:
      - 管理
      responses:
        '200':
          description: スペース一覧（拠点名つき）
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Space"
        '403':
          description: 管理者以外
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      summary: スペースの追加
      tags:
      - 管理
      parameters: []
      responses:
        '201':
          description: 追加した
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Space"
        '422':
          description: 入力内容の誤り
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                space:
                  type: object
                  properties:
                    location_id:
                      type: integer
                    name:
                      type: string
                    kind:
                      type: string
                      enum:
                      - seat
                      - meeting_room
                    capacity:
                      type: integer
                    hourly_price:
                      type: integer
                  required:
                  - location_id
                  - name
                  - kind
                  - capacity
                  - hourly_price
              required:
              - space
  "/api/admin/spaces/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: integer
      required: true
    patch:
      summary: スペースの更新
      tags:
      - 管理
      parameters: []
      responses:
        '200':
          description: 更新した
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Space"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                space:
                  type: object
                  properties:
                    active:
                      type: boolean
              required:
              - space
    delete:
      summary: スペースの削除（予約があれば削除できない）
      tags:
      - 管理
      responses:
        '204':
          description: 削除した
        '422':
          description: 予約がある
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/admin/sales":
    get:
      summary: 拠点別の月次売上
      tags:
      - 管理
      parameters:
      - name: month
        in: query
        required: false
        schema:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
      responses:
        '200':
          description: 拠点別の売上と月額プラン料金
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Sales"
        '403':
          description: 管理者以外
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/admin/stats/usage":
    get:
      summary: 利用状況の集計（予約・ドロップインの件数・時間・金額と、会議室の稼働率）
      tags:
      - 管理
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
        description: 期間の始め（日本時間の日付 YYYY-MM-DD、この日を含む）
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
        description: 期間の終わり（日本時間の日付 YYYY-MM-DD、この日を含む）。期間は366日以内
      - name: group_by
        in: query
        required: false
        schema:
          type: string
          enum:
          - location
          - space
          - month
          - weekday
          - hour
          default: location
        description: まとめ方。location=拠点、space=スペース（ドロップインは数えない）、month=月、weekday=曜日、hour=時間帯（予約は開始、ドロップインはチェックインの時刻。稼働率は出さない）
      - name: location_id
        in: query
        required: false
        schema:
          type: integer
        description: 拠点で絞り込む
      responses:
        '200':
          description: 集計の結果
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UsageStats"
        '400':
          description: 日付・まとめ方・期間が正しくない
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: 管理者以外
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/admin/stats/members":
    get:
      summary: 会員数の集計（プランごとの人数・新しい会員・利用した会員。個人の情報は返さない）
      tags:
      - 管理
      parameters:
      - name: month
        in: query
        required: false
        schema:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
        description: 対象の月（YYYY-MM）。省略すると今月
      responses:
        '200':
          description: 集計の結果
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MemberStats"
        '403':
          description: 管理者以外
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/ai_requests":
    post:
      summary: AI の相談を始める（1日の回数の上限を確かめて記録を作る）
      tags:
      - AI
      parameters: []
      responses:
        '201':
          description: 記録を作った
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AiRequest"
        '429':
          description: 今日の回数の上限に達した
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: 管理者だけの機能（analytics）を一般会員が始めようとした
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: 未ログイン
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ai_request:
                  type: object
                  properties:
                    feature:
                      type: string
                      enum:
                      - booking
                      - analytics
                      description: analytics は管理者だけ
                  required:
                  - feature
              required:
              - ai_request
  "/api/ai_requests/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: integer
      required: true
    patch:
      summary: 終わった相談のトークン数・料金・応答時間を書く
      tags:
      - AI
      parameters: []
      responses:
        '200':
          description: 書いた
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AiRequest"
        '404':
          description: 他人の記録
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: すでに終わっている
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: 未ログイン
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ai_request:
                  type: object
                  properties:
                    status:
                      type: string
                      enum:
                      - succeeded
                      - failed
                      - refused
                    model:
                      type: string
                    input_tokens:
                      type: integer
                    output_tokens:
                      type: integer
                    cache_read_input_tokens:
                      type: integer
                    cache_creation_input_tokens:
                      type: integer
                    cost_micro_usd:
                      type: integer
                      description: 料金（米ドル）×1,000,000
                    duration_ms:
                      type: integer
                    tool_calls:
                      type: integer
                    error_code:
                      type: string
                  required:
                  - status
              required:
              - ai_request
